# MediaMTX config for production (Docker). API and HLS ports are NOT published outside the
# compose network; only ingest ports (1935, 8890, 8889) are. MEDIAMTX_SECRET comes from env.
logLevel: info

# Every action is authorized by the Capture Cat API:
# - publish: stream key check
# - read/playback/api: only the API itself (internal basic-auth credentials)
authMethod: http
# Set via MTX_AUTHHTTPADDRESS in docker-compose.yml (includes the secret).
authHTTPAddress: http://api:4000/api/mediamtx/auth?secret=CHANGE_ME

api: true
apiAddress: :9997
metrics: false
pprof: false
playback: false

# Ingest
rtmp: true
rtmpAddress: :1935
srt: true
srtAddress: :8890
webrtc: true
webrtcAddress: :8889
rtsp: false

# Live HLS: internal only; browsers reach it through the API's /live proxy (auth-checked).
hls: true
hlsAddress: :8888
hlsVariant: lowLatency
hlsAllowOrigins: []
hlsSegmentCount: 30
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

pathDefaults:
  record: true
  recordPath: /data/recordings/%path/%s-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 10m
  # Capture Cat deletes recordings itself after finalizing them.
  recordDeleteAfter: 0s
  # Don't let a second publisher with the same key take over a live stream.
  overridePublisher: false

paths:
  # Only live/<channelId> is accepted.
  "~^live/[A-Za-z0-9]+$": {}

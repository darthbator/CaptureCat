# Optional for development: a mock OAuth/OIDC provider to test the real login flow
# (redirect → callback → account linking → session) with any identity you choose.
#   docker compose -f infra/docker-compose.mock-oidc.yml up -d
#   then start the API with MOCK_OIDC_DISCOVERY_URL=http://localhost:8080/default/.well-known/openid-configuration
services:
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8080:8080"
    environment:
      JSON_CONFIG: '{"interactiveLogin": true}'
